---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  {% if page.series == "qb-success" %}
  {% include qb-series.html %}
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
  {% include related-writing.html %}
</article>
